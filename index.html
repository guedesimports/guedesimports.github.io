:root{
  --bg:#fff; --fg:#0f1114; --muted:#5f6670; --surface:#f4f5f7; --line:#e1e4e8; --blue:#2b7fff; --blue-d:#1a63d6; --ink:#1c1f24;

  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e0f12;--fg:#f2f3f5;--muted:#9aa1ab;--surface:#181a1f;--line:#2a2d34;--ink:#e6e8ec}
}
:root[data-theme="dark"]{--bg:#0e0f12;--fg:#f2f3f5;--muted:#9aa1ab;--surface:#181a1f;--line:#2a2d34;--ink:#e6e8ec}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.display{font-family:var(--display);font-weight:400;line-height:.92;margin:0;letter-spacing:.01em}
.btn{display:inline-block;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;padding:14px 24px;border:2px solid var(--blue);font-size:.95rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ghost{background:transparent;border-color:#fff}
.btn.ghost:hover{background:#fff;color:#0a0a0a}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{background:#0a0a0a;color:#d6d9de;font-size:.82rem;text-align:center;padding:8px 16px}
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:11}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--display);font-size:2rem;line-height:1;text-decoration:none;letter-spacing:.02em}
.logo i{color:var(--blue);font-style:normal}
nav{display:flex;align-items:center;gap:24px;font-weight:500;font-size:.95rem}
nav a.link{text-decoration:none;display:none}
nav a.link:hover{color:var(--blue)}
nav .btn{padding:9px 16px;font-size:.88rem}
