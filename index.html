/* Layout: capa de lookbook streetwear. Título gigante condensado, faixa de marca, três blocos curtos e um chamado direto pro WhatsApp. */
:root {
  --bg: #FFFFFF;
  --fg: #0A0A0A;
  --muted: #5A5F69;
  --line: #D5D8DD;
  --panel: #EEEFF1;
  --accent: #0A5CFF;
  --on-accent: #FFFFFF;
  --wa: #0A5CFF;
  --on-wa: #FFFFFF;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {

    --bg: #0A0A0A; --fg: #FFFFFF; --muted: #A3A7AF; --line: #26282C; --panel: #151618;
    --accent: #2A7FFF; --on-accent: #FFFFFF; --wa: #2A7FFF; --on-wa: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {

* { box-sizing: border-box; }

}

.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

}

.btn.ghost { background: transparent; color: var(--fg); }
.btn:hover { transform: translateY(-2px); }
.btn { transition: transform .15s ease; }
