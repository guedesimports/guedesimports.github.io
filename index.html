:root{
  --black:#0a0a0a; --white:#fff; --gray:#eef0f3; --gray-d:#6b7078; --line:#dcdfe4; --blue:#2b7fff; --blue-d:#1a63d6;
  --display:'Bebas Neue','Arial Narrow',Impact,sans-serif; --body:'DM Sans',system-ui,-apple-system,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--black);font-family:var(--body);line-height:1.5;padding-bottom:76px}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.display{font-family:var(--display);font-weight:400;line-height:.92;margin:0;letter-spacing:.01em}
.btn{display:inline-block;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;padding:14px 24px;border:2px solid var(--blue);font-size:.95rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ghost{background:transparent;border-color:#fff;color:#fff}
.btn.ghost:hover{background:#fff;color:var(--black)}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{background:var(--black);color:#d6d9de;font-size:.82rem;text-align:center;padding:8px 16px}
header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--display);font-size:2rem;line-height:1;text-decoration:none}
.logo i{color:var(--blue);font-style:normal}
nav{display:flex;align-items:center;gap:24px;font-weight:500;font-size:.95rem}
nav a.link{text-decoration:none;display:none}
nav a.link:hover{color:var(--blue)}
nav .btn{padding:9px 16px;font-size:.88rem}

.hero{background:var(--black);color:#fff;padding:52px 0 60px}
.hero .wrap{display:grid;gap:28px}
.tag{display:inline-block;background:var(--blue);font-weight:700;font-size:.8rem;padding:5px 11px;margin-bottom:18px}
.hero h1{font-size:clamp(3.8rem,15vw,7.5rem)}
.hero h1 span{color:transparent;-webkit-text-stroke:2px #fff}
.hero p{color:#aeb3ba;font-size:1.1rem;max-width:34ch;margin:20px 0 28px}
.row{display:flex;gap:12px;flex-wrap:wrap}

.info{background:var(--gray);border-bottom:1px solid var(--line)}
.info .wrap{display:grid;gap:0}
.info div{padding:16px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.info div:last-child{border-bottom:0}
.info b{display:block}
.info span{color:var(--gray-d)}

.shop{padding:56px 0}
.shop-head h2{font-size:3rem}
.shop-head p{color:var(--gray-d);margin:6px 0 22px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;background:var(--white);border:1px solid var(--line);color:var(--black);padding:9px 18px;font:500 .9rem var(--body);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.card[hidden]{display:none}
.thumb{position:relative;aspect-ratio:4/5;background:var(--gray);display:flex;align-items:center;justify-content:center;color:#c4c9d1}
.thumb svg{width:58%;height:auto}
.thumb .tag{position:absolute;top:10px;left:10px;margin:0;font-size:.72rem;padding:4px 9px;color:#fff}
.card h3{font-size:1rem;font-weight:700;margin:12px 0 2px}
.card p{margin:0 0 10px;color:var(--gray-d);font-size:.85rem}
.card a{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:.88rem;padding:11px;border:2px solid var(--black)}
.card a:hover{background:var(--black);color:#fff}

.how{background:var(--gray);padding:56px 0}
.how h2{font-size:3rem;margin-bottom:24px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{counter-increment:s;background:var(--white);padding:22px;border:1px solid var(--line)}
.steps li::before{content:counter(s);font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--blue);display:block;margin-bottom:6px}
.steps b{display:block}
.steps span{color:var(--gray-d);font-size:.92rem}

.cta{background:var(--blue);color:#fff;padding:56px 0;text-align:center}
.cta h2{font-size:3.2rem;margin-bottom:12px}
.cta p{margin:0 auto 24px;max-width:36ch}
